# =====================================================================
# Algo Robot - Production Nginx Virtual Host & Reverse Proxy
# =====================================================================

# WebSocket Connection Upgrade Mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Upstream Backend Pool
upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

# Upstream Frontend Pool
upstream frontend_upstream {
    server frontend:3000;
    keepalive 32;
}

# ---------------------------------------------------------------------
# Primary HTTP Server (Port 80)
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name localhost algo-robot.local _;

    # Let's Encrypt ACME verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API Proxy (with rate limiting & buffering)
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Real-Time WebSocket Proxy (/ws/live-ticks)
    location /ws/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Next.js Static Asset Cache
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js Frontend SSR & Application Pages
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

